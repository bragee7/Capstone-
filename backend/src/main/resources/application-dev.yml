# Development profile — MySQL 8 local connection.
# Values come from environment variables (see .env / .env.example).
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campushire?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:campushire}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
